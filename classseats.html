                <div style="font-size:14px; font-weight:bold; margin-bottom:8px;">🛟 本地安全备份</div>
                <div id="seatBackupHint" style="font-size:12px; color:#8e9196; margin-bottom:8px;">读取或重排前会自动保留最近 10 份座位表。</div>
                <select id="seatBackupList" aria-label="选择要恢复的座位备份" style="width:100%; padding:10px; border:1px solid #c2c7cf; border-radius:8px; margin-bottom:10px;"><option value="">暂无本地备份</option></select>
                <button class="btn-github-load" id="restoreSeatBackupBtn" onclick="restoreSeatBackup()" style="width:100%;">恢复选中的备份</button>
            </div>
        </div>
    </div>
</div>

<script>
    // === 手机端拖拽兼容（增加保护，防止无网络时阻塞整个脚本） ===
    try {
        if (typeof MobileDragDrop !== 'undefined') {
            MobileDragDrop.polyfill({
                holdToDrag: 100 // 长按100毫秒触发，防误触
            });
        }
    } catch(err) {
        console.warn('手机拖拽辅助库未加载。');
    }

    // === 变量声明（严格避免重复声明） ===
    let studentsData = [];
    let isMirrored = false; 
    let isBoxesRemoved = false; 
    let isManualMode = false; // 手动指定座位模式标志位
    let savedBoxesData = [];
    let customBoxes = [];
    let colorIndexTracker = 0;
    const seatBackupManager = ClassTools.createJsonBackupManager('classSeatBackups', 10);
    const SEAT_CLASS_SELECTION_KEY = 'classSeatCurrentRoster';
    let currentClassListFile = ClassTools.loadCurrentStudentListFile(['seatCurrentClassListFile'], SEAT_CLASS_SELECTION_KEY);
    let currentRosterRevision = 0;
    let currentSeatFileSha = null;
    
    let draggedElement = null;
    let activeBox = null, activeHandle = null, startX, startY, startRect;
    let moveActiveBox = null, moveStartX, moveStartY, moveStartRect;

    const subgroupColors = [
        '#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', 
        '#42d4f4', '#f032e6', '#bfef45', '#fabed4', '#469990', '#dcbeff',
        '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#808080'
    ];
    const boxColors = ['#ff9800', '#00bcd4', '#e91e63', '#8bc34a', '#9c27b0'];

    const classroom = document.getElementById('classroom');
    const poolBoys = document.getElementById('pool-boys');
    const poolGirls = document.getElementById('pool-girls');

    // === GitHub 同步参数配置 ===
    const GITHUB_OWNER = 'Dzreal'; 
    const GITHUB_REPO = 'Class-Data'; 
    function getSeatDataFilePath(classListFile = currentClassListFile) {
        const className = ClassTools.getClassNameFromRosterPath(classListFile);
        return ClassTools.getClassDataPaths(className)?.seat || '';
    }

    window.onload = async function() {
        let savedToken = ClassTools.loadGitHubToken(['github_sync_token']);
        if(savedToken) {
            document.getElementById('github-token').value = savedToken;
        }
        setCurrentClassListFile(currentClassListFile);
        renderSeatBackupList();
        updateUndoButton();
        if (savedToken && currentClassListFile) await loadCurrentRosterSilently(savedToken);
    };

    async function openSeatSettings() {
        document.getElementById('tokenModal').classList.remove('hidden');
        await refreshSeatClassSelector(true);
    }

    function saveTokenLocally() {
        let token = document.getElementById('github-token').value.trim();
        ClassTools.saveGitHubToken(token);
        if (token) refreshSeatClassSelector(true);
    }

    function encodeUTF8ToBase64(str) {
        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
            function toSolidBytes(match, p1) {
                return String.fromCharCode('0x' + p1);
        }));
    }

    function decodeBase64ToUTF8(str) {
        return decodeURIComponent(atob(str).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    }

    // 每个班级目录下分别保存 roster.json 与 seat.json。
    async function getGitHubJsonFile(token, path, includeMetadata = false) {
        const safePath = ClassTools.encodeGitHubPath(path);
        const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${safePath}`, {
            headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
        });
        if (!response.ok) {
            if (response.status === 404) return null;
            throw new Error('读取云端文件失败');
        }
        const data = await response.json();
        const content = JSON.parse(decodeBase64ToUTF8(data.content));
        return includeMetadata ? { content, sha: data.sha } : content;
    }

    async function listGitHubDirectories(token, directory) {
        const safePath = ClassTools.encodeGitHubPath(directory);
        const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${safePath}`, {
            headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
        });
        if (response.status === 404) return [];
        if (!response.ok) throw new Error('读取班级列表失败');
        const data = await response.json();
        return data.filter(item => item.type === 'dir').map(item => item.name);
    }

    function getStudentReference(studentElement) {
        return studentElement?.dataset?.studentId || studentElement?.id || '';
    }

    function findStudentElementByReference(reference) {
        const safeReference = String(reference ?? '');
        return Array.from(document.querySelectorAll('.student')).find(student => (
            student.dataset.studentId === safeReference || student.id === safeReference
        )) || null;
    }

    async function saveToGitHubCloud() {
        let token = document.getElementById('github-token').value.trim();
        if (!token) { alert('⚠️ 请先输入 Token！'); return; }

        saveTokenLocally();

        if (studentsData.length === 0) { alert('当前没有数据可保存！'); return; }
        if (!getSeatDataFilePath()) { alert('请先在设置中选择班级。'); return; }

        try {
            const latestRoster = await getGitHubJsonFile(token, currentClassListFile);
            const latestRosterRevision = ClassTools.normalizeStudentListDocument(latestRoster).updatedAt;
            if (latestRosterRevision !== currentRosterRevision) {
                alert('班级名单已经更新，请重新选择当前班级后再保存座位。');
                return;
            }
        } catch (error) {
            alert('保存前无法确认最新班级名单，请检查网络后重试。');
            return;
        }

        let exportData = {
            schemaVersion: 3,
            updatedAt: Date.now(),
            classId: ClassTools.getClassNameFromRosterPath(currentClassListFile),
            rosterRevision: currentRosterRevision,
            config: {
                cols: document.getElementById('set-cols').value,
                rows: document.getElementById('set-rows').value,
                colsPerGroup: document.getElementById('set-colsPerGroup').value,
                doorPos: document.getElementById('set-door').value,
                isMirrored: isMirrored
            },
            deletedSeatIds: Array.from(document.querySelectorAll('.seat.deleted')).map(s => s.id),
            layout: {},
            boxesData: customBoxes.map(b => ({
                seats: b.attachedSeats.map(s => s.id),
                color: b.el.style.borderColor
            }))
        };
        document.querySelectorAll('.seat').forEach(seat => {
            if (seat.children.length > 0) exportData.layout[seat.id] = getStudentReference(seat.children[0]);
        });

        let jsonString = JSON.stringify(exportData);
        let base64Content = encodeUTF8ToBase64(jsonString);

        try {
            document.querySelector('.btn-github-save').innerText = '正在保存...';
            const seatDataPath = getSeatDataFilePath();
            let url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${ClassTools.encodeGitHubPath(seatDataPath)}`;
            let bodyData = {
                message: "Cloud save seat data to Private Repo",
                content: base64Content
            };
            if (currentSeatFileSha) bodyData.sha = currentSeatFileSha;

            let response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyData)
            });

            if (response.ok) {
                const savedFile = await response.json();
                currentSeatFileSha = savedFile.content?.sha || currentSeatFileSha;
                alert('✅ 成功保存至云端私有仓库！');
            } else {
                let errData = await response.json();
                if (response.status === 409 || response.status === 422) {
                    alert('云端座位数据已经更新，请先从云端重新读取后再保存。');
                } else {
                    alert('❌ 保存失败：' + (errData.message || '请确保Token填写正确，且拥有写入私有仓库的权限。'));
                }
            }
        } catch (e) {
            alert('网络错误：无法连接到云端。如果你在国内，通常是因为网络拦截了接口 (api.github.com)，建议开启加速器后重试。\n详细报错：' + e.message);
        } finally {
            document.querySelector('.btn-github-save').innerText = '☁️ 保存至云端';
        }
    }

    async function loadFromGitHubCloud() {
        let token = document.getElementById('github-token').value.trim();
        if (!token) { alert('⚠️ 请先输入 Token！'); return; }
        
        saveTokenLocally();

        try {
            document.querySelector('.btn-github-load').innerText = '正在读取...';
            const cloudFile = await getGitHubJsonFile(token, getSeatDataFilePath(), true);
            if (cloudFile) {
                currentSeatFileSha = cloudFile.sha;
                if (applyCloudSeatData(cloudFile.content) !== false) {
                    alert('✅ 已从云端读取并完美还原排座！');
                }
            } else {
                alert('❌ 读取失败，可能是云端还没有保存过数据，或者私有仓库名字没有对应上。');
            }
        } catch (e) {
            alert('网络错误：无法连接到云端。如果你在国内，通常是因为网络拦截了接口 (api.github.com)，建议开启加速器后重试。\n详细报错：' + e.message);
        } finally {
            document.querySelector('.btn-github-load').innerText = '☁️ 从云端读取';
        }
    }

    function setCurrentClassListFile(path) {
        currentClassListFile = ClassTools.saveCurrentStudentListFile(path, SEAT_CLASS_SELECTION_KEY);
    }

    function applyCloudSeatData(seatData, skipSafetyBackup = false) {
        const classId = ClassTools.getClassNameFromRosterPath(currentClassListFile);
        if (!classId || seatData.classId !== classId) throw new Error('座位数据与当前班级不一致');
        return applyImportedData({
            ...seatData,
            classListFile: currentClassListFile,
            studentsData: studentsData
        }, skipSafetyBackup);
    }

    async function refreshSeatClassSelector(silent = false) {
        const select = document.getElementById('seatClassSelector');
        const token = document.getElementById('github-token').value.trim();
        if (!token) {
            select.innerHTML = '<option value="">请先填写 Token</option>';
            return;
        }
        select.innerHTML = '<option value="">正在读取班级...</option>';
        try {
            const files = await listGitHubDirectories(token, 'classes');
            select.innerHTML = '<option value="">请选择班级...</option>';
            files.forEach(fileName => {
                const option = document.createElement('option');
                option.value = fileName;
                option.textContent = fileName;
                select.appendChild(option);
            });
            const currentFileName = (/^classes\/([^/]+)\/roster\.json$/i.exec(currentClassListFile) || [])[1] || '';
            if (files.includes(currentFileName)) select.value = currentFileName;
        } catch (error) {
            select.innerHTML = '<option value="">班级读取失败</option>';
            if (!silent) alert('读取班级列表失败：' + error.message);
        }
    }

    async function applySelectedSeatClass() {
        const token = document.getElementById('github-token').value.trim();
        const fileName = document.getElementById('seatClassSelector').value;
        if (!token) { alert('⚠️ 请先输入 Token！'); return; }
        if (!fileName) { alert('请先选择班级。'); return; }

        const filePath = ClassTools.getClassDataPaths(fileName).roster;
        if (studentsData.length > 0 && filePath !== currentClassListFile
            && !confirm('切换班级会替换当前学生和座位安排，当前现场会先自动备份。确定继续吗？')) return;

        try {
            const cloudData = await getGitHubJsonFile(token, filePath);
            const classDocument = ClassTools.normalizeStudentListDocument(cloudData, fileName.replace(/\.json$/i, ''));
            const rosterStudents = ClassTools.normalizeStudentList(classDocument.students);
            if (rosterStudents.length === 0) throw new Error('班级名单为空');
            if (rosterStudents.some(student => !student.gender)) throw new Error('班级名单缺少性别，请在投票页重新导入完整名单');
            if (!backupCurrentSeatState('切换班级前')) return;
            setCurrentClassListFile(filePath);
            currentRosterRevision = classDocument.updatedAt;

            const seatFile = await getGitHubJsonFile(token, getSeatDataFilePath(filePath), true);
            const seatData = seatFile?.content || null;
            currentSeatFileSha = seatFile?.sha || null;

            if (seatData) {
                studentsData = rosterStudents;
                applyCloudSeatData(seatData, true);
            } else {
                const currentState = collectCurrentSeatState();
                applyImportedData({
                    ...currentState,
                    classListFile: filePath,
                    studentsData: rosterStudents,
                    layout: {}
                }, true);
            }
            document.getElementById('seatClassStatus').textContent = `当前班级：${fileName.replace(/\.json$/i, '')}`;
        } catch (error) {
            alert('读取班级失败：' + error.message);
        }
    }

    async function loadCurrentRosterSilently(token) {
        try {
            const cloudData = await getGitHubJsonFile(token, currentClassListFile);
            const classDocument = ClassTools.normalizeStudentListDocument(cloudData);
            if (classDocument.students.length === 0) return;

            const rosterStudents = ClassTools.normalizeStudentList(classDocument.students);
            if (rosterStudents.some(student => !student.gender)) return;
            studentsData = rosterStudents;
            currentRosterRevision = classDocument.updatedAt;
            const seatFile = await getGitHubJsonFile(token, getSeatDataFilePath(), true);
            currentSeatFileSha = seatFile?.sha || null;
            if (seatFile?.content) applyCloudSeatData(seatFile.content, true);
            else renderStudents();
        } catch (error) {
            console.warn('当前学生名单暂时无法自动读取。', error);
        }
    }

    function updatePoolCounts() {
        let h2 = document.querySelector('.list-box h2');
        let h3Boys = poolBoys.querySelector('h3');
        let h3Girls = poolGirls.querySelector('h3');
        
        if (studentsData.length === 0) {
            if (h2) h2.innerText = '待分配名单';
            if (h3Boys) h3Boys.innerText = '男生名单';
            if (h3Girls) h3Girls.innerText = '女生名单';
            return;
        }

        let boysCount = poolBoys.querySelectorAll('.student').length;
        let girlsCount = poolGirls.querySelectorAll('.student').length;
        let totalCount = boysCount + girlsCount;

        if (h2) h2.innerText = `待分配名单（${totalCount}人）`;
        if (h3Boys) h3Boys.innerText = `男生名单（${boysCount}人）`;
        if (h3Girls) h3Girls.innerText = `女生名单（${girlsCount}人）`;
    }

    function collectCurrentSeatState() {
        const layout = {};
        document.querySelectorAll('.seat').forEach(seat => {
            if (seat.children.length > 0 && seat.children[0].classList.contains('student')) {
                layout[seat.id] = getStudentReference(seat.children[0]);
            }
        });

        return {
            schemaVersion: 2,
            updatedAt: Date.now(),
            classListFile: currentClassListFile,
            studentsData: ClassTools.normalizeStudentList(studentsData),
            config: {
                cols: document.getElementById('set-cols').value,
                rows: document.getElementById('set-rows').value,
                colsPerGroup: document.getElementById('set-colsPerGroup').value,
                doorPos: document.getElementById('set-door').value,
                isMirrored
            },
            deletedSeatIds: Array.from(document.querySelectorAll('.seat.deleted')).map(seat => seat.id),
            layout,
            boxesData: customBoxes.map(box => ({
                seats: box.attachedSeats.map(seat => seat.id),
                color: box.el.style.borderColor
            }))
        };
    }

    function backupCurrentSeatState(reason) {
        if (studentsData.length === 0) return true;
        const result = seatBackupManager.snapshot(collectCurrentSeatState(), reason);
        if (!result.ok) {
            alert('⚠️ 本地存储空间不足，无法创建安全备份。为防止座位数据丢失，本次操作已经停止。');
            return false;
        }
        renderSeatBackupList();
        return true;
    }

    function renderSeatBackupList() {
        const select = document.getElementById('seatBackupList');
        const hint = document.getElementById('seatBackupHint');
        const restoreButton = document.getElementById('restoreSeatBackupBtn');
        if (!select || !hint || !restoreButton) return;

        const backups = seatBackupManager.list();
        select.innerHTML = '';
        if (backups.length === 0) {
            const option = document.createElement('option');
            option.value = '';
            option.textContent = '暂无本地备份';
            select.appendChild(option);
            select.disabled = true;
            restoreButton.disabled = true;
            hint.textContent = '读取或重排前会自动保留最近 10 份座位表。';
            updateUndoButton();
            return;
        }

        backups.forEach(backup => {
            const option = document.createElement('option');
            option.value = backup.id;
            option.textContent = `${new Date(backup.createdAt).toLocaleString('zh-CN', { hour12: false })} · ${backup.reason}`;
            select.appendChild(option);
        });
        select.disabled = false;
        restoreButton.disabled = false;
        hint.textContent = `当前有 ${backups.length} 份快照，最多保留 ${seatBackupManager.maxBackups} 份。`;
        updateUndoButton();
    }

    function updateUndoButton() {
        const button = document.getElementById('btn-undo-seat');
        if (!button) return;
        const latestBackup = seatBackupManager.list()[0];
        button.disabled = !latestBackup;
        button.title = latestBackup ? `恢复到：${latestBackup.reason}` : '当前没有可以撤销的操作';
    }

    function undoLastSeatAction() {
        const latestBackup = seatBackupManager.list()[0];
        if (!latestBackup) { alert('当前没有可以撤销的操作。'); return; }

        try {
            applyImportedData(latestBackup.data, true);
            seatBackupManager.remove(latestBackup.id);
            renderSeatBackupList();

            const button = document.getElementById('btn-undo-seat');
            const normalText = '↩️ 撤销上一步';
            button.textContent = `✅ 已撤销：${latestBackup.reason}`;
            setTimeout(() => { button.textContent = normalText; }, 1400);
        } catch (error) {
            alert('撤销失败：' + error.message);
        }
    }

    function restoreSeatBackup() {
        const backup = seatBackupManager.get(document.getElementById('seatBackupList').value);
        if (!backup) { alert('没有找到选中的座位备份。'); return; }
        if (!confirm('确定恢复这份座位表吗？当前座位也会先自动备份。')) return;
        if (!backupCurrentSeatState('恢复座位备份前')) return;
        applyImportedData(backup.data, true);
        renderSeatBackupList();
        alert('✅ 已恢复选中的座位备份。');
    }

    function applyImportedData(importedData, skipSafetyBackup = false) {
        if (!importedData || !Array.isArray(importedData.studentsData)) throw new Error('座位数据格式不完整');
        if (!skipSafetyBackup && !backupCurrentSeatState('读取新座位数据前')) return false;
        if(importedData.studentsData) {
            studentsData = ClassTools.normalizeStudentList(importedData.studentsData);
            if (studentsData.some(student => student.gender !== '男' && student.gender !== '女')) {
                throw new Error('学生名单中存在未填写性别的学生');
            }
            setCurrentClassListFile(
                ClassTools.validateGitHubRelativePath(importedData.classListFile || '')
                    ? importedData.classListFile
                    : currentClassListFile
            );
            renderStudents();
        }

        if(importedData.config) {
            document.getElementById('set-cols').value = importedData.config.cols;
            document.getElementById('set-rows').value = importedData.config.rows;
            document.getElementById('set-colsPerGroup').value = importedData.config.colsPerGroup;
            document.getElementById('set-door').value = importedData.config.doorPos;
            
            let targetMirror = importedData.config.isMirrored || false;
            generateLayout(true);
            if (isMirrored !== targetMirror) toggleMirror(true);
        }

        if(importedData.deletedSeatIds) {
            document.querySelectorAll('.seat').forEach(s => {
                if (importedData.deletedSeatIds.includes(s.id)) s.classList.add('deleted');
                else s.classList.remove('deleted');
            });
        }

        if(importedData.layout) {
            for (let seatId in importedData.layout) {
                let stuId = importedData.layout[seatId];
                let seat = document.getElementById(seatId);
                let stu = findStudentElementByReference(stuId);
                if (seat && stu) seat.appendChild(stu);
            }
        }

        customBoxes.forEach(b => b.el.remove());
        customBoxes = [];

        if(Array.isArray(importedData.boxesData)) {
            importedData.boxesData.forEach(boxObj => {
                if (Array.isArray(boxObj)) { 
                    let seats = boxObj.map(id => document.getElementById(id)).filter(s => s !== null);
                    if (seats.length > 0) createCustomBox(seats);
                } else if (boxObj && Array.isArray(boxObj.seats)) {
                    let seats = boxObj.seats.map(id => document.getElementById(id)).filter(s => s !== null);
                    if (seats.length > 0) createCustomBox(seats, boxObj.color);
                }
            });
        }

        isBoxesRemoved = false;
        savedBoxesData = [];
        let toggleBtn = document.getElementById('btn-toggle-boxes');
        if (toggleBtn) {
            toggleBtn.innerHTML = '🔲 去除所有小组框';
            toggleBtn.style.backgroundColor = '';
        }

        updatePoolCounts();
        return true;
    }

    function renderStudents() {
        document.querySelectorAll('.student').forEach(el => el.remove());
        poolBoys.innerHTML = '<h3>男生名单</h3>';
        poolGirls.innerHTML = '<h3>女生名单</h3>';

        studentsData = ClassTools.normalizeStudentList(studentsData);
        studentsData.forEach((student, index) => {
            let stuDiv = document.createElement('div');
            stuDiv.id = 'stu-' + index;
            stuDiv.dataset.studentId = student.id;
            stuDiv.className = 'student ' + (student.gender === '男' ? 'boy' : 'girl');
            stuDiv.draggable = true;
            stuDiv.innerText = student.name;
            stuDiv.ondragstart = dragStart;
            stuDiv.ondragend = dragEnd;
            if (student.gender === '男') poolBoys.appendChild(stuDiv);
            else poolGirls.appendChild(stuDiv);
        });
        sortPool(poolBoys);
        sortPool(poolGirls);
        updatePoolCounts();
    }

    function sortPool(poolElement) {
        let students = Array.from(poolElement.querySelectorAll('.student'));
        students.sort((a, b) => a.innerText.localeCompare(b.innerText, 'zh-Hans-CN'));
        students.forEach(stu => poolElement.appendChild(stu));
    }

    function resetAll() {
        document.querySelectorAll('.student').forEach(stu => {
            if (stu.classList.contains('boy')) poolBoys.appendChild(stu);
            else poolGirls.appendChild(stu);
        });
        sortPool(poolBoys);
        sortPool(poolGirls);
        updatePoolCounts();
    }

    function resetAllWithBackup() {
        if (!backupCurrentSeatState('名单全体归位前')) return;
        resetAll();
    }

    function toggleMirror(skipSafetyBackup = false) {
        if (!skipSafetyBackup && !backupCurrentSeatState('切换师生视角前')) return;
        isMirrored = !isMirrored;
        
        let btn = document.getElementById('btn-mirror');
        if (isMirrored) {
            btn.innerHTML = '✅ 退出镜像 (恢复原状)';
            btn.style.backgroundColor = '#E91E63';
        } else {
            btn.innerHTML = '🔄 师生视角切换';
            btn.style.backgroundColor = '#607d8b';
        }

        let wrapper = document.getElementById('classroom-wrapper');
        let board = document.querySelector('.blackboard');
        if (isMirrored) {
            wrapper.appendChild(board);
            board.style.marginBottom = '0px';
            board.style.marginTop = '20px';
        } else {
            wrapper.prepend(board);
            board.style.marginTop = '0px';
            board.style.marginBottom = '20px';
        }

        let groups = Array.from(classroom.querySelectorAll('.group'));
        groups.reverse().forEach((g, idx) => classroom.insertBefore(g, classroom.children[idx]));

        groups.forEach(g => {
            let subs = Array.from(g.querySelectorAll('.subgroup'));
            subs.reverse().forEach((sub, idx) => g.insertBefore(sub, g.children[idx]));

            subs.forEach(sub => {
                let seats = Array.from(sub.querySelectorAll('.seat'));
                seats.reverse().forEach((seat, idx) => sub.insertBefore(seat, sub.children[idx]));
            });
        });

        let door = document.querySelector('.door');
        if (door) {
            if (door.classList.contains('left')) {
                door.classList.remove('left');
                door.classList.add('right');
            } else if (door.classList.contains('right')) {
                door.classList.remove('right');
                door.classList.add('left');
            }
            if (isMirrored) {
                door.style.top = 'auto';
                door.style.bottom = '0';
            } else {
                door.style.bottom = 'auto';
                door.style.top = '0';
            }
        }

        customBoxes.forEach(b => b.updateLayout());
    }
    
    function toggleBoxes() {
        if (!backupCurrentSeatState(isBoxesRemoved ? '恢复小组框前' : '去除小组框前')) return;
        let btn = document.getElementById('btn-toggle-boxes');
        
        if (!isBoxesRemoved) {
            savedBoxesData = customBoxes.map(b => ({
                seats: b.attachedSeats.map(s => s.id),
                color: b.el.style.borderColor
            }));
            
            customBoxes.forEach(b => b.el.remove());
            customBoxes = []; 
            
            isBoxesRemoved = true;
            btn.innerHTML = '🔲 恢复所有小组框';
            btn.style.backgroundColor = '#9e9e9e'; 
        } else {
            savedBoxesData.forEach(boxData => {
                let seats = boxData.seats.map(id => document.getElementById(id)).filter(s => s !== null);
                if (seats.length > 0) {
                    createCustomBox(seats, boxData.color);
                }
            });
            
            savedBoxesData = []; 
            isBoxesRemoved = false;
            btn.innerHTML = '🔲 去除所有小组框';
            btn.style.backgroundColor = ''; 
        }
    }

    // === 手动指定座位模式逻辑 ===
    function toggleManualMode() {
        isManualMode = !isManualMode;
        const btn = document.getElementById('btn-manual-toggle');
        if (isManualMode) {
            btn.classList.add('active');
            btn.innerHTML = '✅ 正在手动指定座位（再次点击关闭）';
        } else {
            btn.classList.remove('active');
            btn.innerHTML = '⌨️ 手动指定座位';
        }
    }

    // 处理座位点击：如果是手动模式，则创建输入框
    document.addEventListener('click', function(e) {
        if (!isManualMode) return;
        
        const seat = e.target.closest('.seat');
        if (!seat || seat.classList.contains('deleted')) return;
        
        // 如果点击的是已经存在的输入框，不处理
        if (e.target.classList.contains('seat-input')) return;

        createSeatInput(seat);
    });

    function createSeatInput(seat) {
        if (!backupCurrentSeatState('手动调整座位前')) return;
        // 如果已经有输入框在运行，先确认掉它
        const existingInput = document.querySelector('.seat-input');
        if (existingInput) {
            confirmSeatInput(existingInput);
        }

        // 如果座位上原本有人，先取出来放回池子
        if (seat.children.length > 0 && !seat.querySelector('.seat-input')) {
            const stu = seat.children[0];
            const correctPool = stu.classList.contains('boy') ? poolBoys : poolGirls;
            correctPool.appendChild(stu);
            sortPool(correctPool);
        }

        const currentName = seat.innerText.trim();
        seat.innerHTML = '';
        
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'seat-input';
        input.value = (currentName === '双击恢复' || currentName === '') ? '' : currentName;
        
        input.onkeydown = function(ev) {
            if (ev.key === 'Enter') {
                ev.preventDefault();
                confirmSeatInput(this);
            } else if (ev.key === 'Tab') {
                ev.preventDefault();
                let currentInput = this;
                // 先确认当前输入，这样如果发生人员移动，原座位会立刻变为空位
                confirmSeatInput(currentInput);
                
                const nextSeat = findNextSeat(seat, ev.shiftKey);
                if (nextSeat) {
                    setTimeout(() => createSeatInput(nextSeat), 50);
                }
            }
        };
        
        input.onblur = function() {
            setTimeout(() => {
                if (this.parentNode === seat) confirmSeatInput(this);
            }, 200);
        };

        seat.appendChild(input);
        input.focus();
        if (input.value) input.select();
    }

    function confirmSeatInput(input) {
        const seat = input.parentNode;
        if (!seat) return;
        
        const name = input.value.trim();
        input.remove();

        if (name === '') {
            updatePoolCounts();
            return;
        }

        let studentInfo = studentsData.find(s => s.name === name);
        let stuDiv = findStudentDivByName(name);
        
        if (!stuDiv) {
            if (studentInfo) {
                stuDiv = document.createElement('div');
                stuDiv.id = 'stu-' + studentsData.indexOf(studentInfo);
                stuDiv.dataset.studentId = studentInfo.id;
                stuDiv.className = 'student ' + (studentInfo.gender === '男' ? 'boy' : 'girl');
            } else {
                alert(`“${name}”不在当前班级名单中。请先到投票页的班级管理中更新名单。`);
                return;
            }
            stuDiv.draggable = true;
            stuDiv.innerText = name;
            stuDiv.ondragstart = dragStart;
            stuDiv.ondragend = dragEnd;
        }

        // 自动移动：appendChild 会自动将元素从原位置移除
        seat.appendChild(stuDiv);
        
        updatePoolCounts();
        sortPool(poolBoys);
        sortPool(poolGirls);
    }

    function findStudentDivByName(name) {
        const students = document.querySelectorAll('.student');
        for (let s of students) {
            if (s.innerText.trim() === name) return s;
        }
        return null;
    }

    function findNextSeat(currentSeat, isReverse = false) {
        const allSeats = Array.from(document.querySelectorAll('.seat:not(.deleted)'));
        
        // 1. 完全基于“视觉矩形框”进行分组（所见即所得）
        // 抛弃底层绑定的记录，彻底解决由于读取历史记录导致的大框只绑定了少数座位的问题
        let visualBoxes = customBoxes.map(b => b.el.getBoundingClientRect());
        let boxMap = new Map();
        let unboxedSeats = [];

        allSeats.forEach(seat => {
            let rect = seat.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;
            
            // 倒序遍历，保证最上层（最新）的框优先包裹座位
            let foundBoxIdx = -1;
            for (let i = visualBoxes.length - 1; i >= 0; i--) {
                let vBox = visualBoxes[i];
                if (centerX >= vBox.left && centerX <= vBox.right && centerY >= vBox.top && centerY <= vBox.bottom) {
                    foundBoxIdx = i;
                    break;
                }
            }
            
            if (foundBoxIdx !== -1) {
                let boxObj = customBoxes[foundBoxIdx];
                if (!boxMap.has(boxObj)) boxMap.set(boxObj, []);
                boxMap.get(boxObj).push(seat);
            } else {
                unboxedSeats.push(seat);
            }
        });

        let groups = [];
        for (let seats of boxMap.values()) {
            if (seats.length > 0) groups.push({ seats: seats });
        }

        // 没有被小组框包裹的座位，按照默认的 subgroup 进行分组（维持没框时 4个4个 的跳转节奏）
        let unboxedGroupMap = new Map();
        unboxedSeats.forEach(seat => {
            let sub = seat.closest('.subgroup');
            if (!unboxedGroupMap.has(sub)) unboxedGroupMap.set(sub, []);
            unboxedGroupMap.get(sub).push(seat);
        });
        
        for (let seats of unboxedGroupMap.values()) {
            if (seats.length > 0) groups.push({ seats: seats });
        }

        // 2. 保证同一个组内的座位按照行列顺序（从左到右，从上到下）排序
        groups.forEach(g => {
            g.seats.sort((a, b) => {
                let rA = parseInt(a.dataset.row), rB = parseInt(b.dataset.row);
                if (rA !== rB) return rA - rB;
                return parseInt(a.dataset.col) - parseInt(b.dataset.col);
            });
        });

        // 3. 宏观组与组之间，按照各组最左上角座位的物理位置（行、列）进行横向优先（Row-Major）排序
        // 这样可以确保录入时是从左到右填完一整排，再往下填，而不是顺着 HTML 的列往下跳
        groups.sort((a, b) => {
            let aMinRow = Math.min(...a.seats.map(s => parseInt(s.dataset.row)));
            let aMinCol = Math.min(...a.seats.map(s => parseInt(s.dataset.col)));
            let bMinRow = Math.min(...b.seats.map(s => parseInt(s.dataset.row)));
            let bMinCol = Math.min(...b.seats.map(s => parseInt(s.dataset.col)));
            
            if (aMinRow !== bMinRow) return aMinRow - bMinRow;
            return aMinCol - bMinCol;
        });

        // 拼接成最终的全局 Tab 切换顺序
        let orderedSeats = [];
        groups.forEach(g => orderedSeats.push(...g.seats));

        let currentGroup = groups.find(g => g.seats.includes(currentSeat));
        const currentIndex = orderedSeats.indexOf(currentSeat);
        
        if (currentIndex !== -1) {
            if (isReverse) {
                // 反向寻找 (Shift + Tab)：直接退回上一个座位
                if (currentIndex > 0) {
                    return orderedSeats[currentIndex - 1];
                }
            } else {
                // 正向寻找 (Tab)：
                // 1. 优先在【当前小组】内循环寻找空位
                let currentSeatIndexInGroup = currentGroup ? currentGroup.seats.indexOf(currentSeat) : -1;
                if (currentGroup && currentSeatIndexInGroup !== -1) {
                    // 1a. 先从当前位置往后寻找同组内的空位
                    for (let i = currentSeatIndexInGroup + 1; i < currentGroup.seats.length; i++) {
                        let s = currentGroup.seats[i];
                        let hasStudent = Array.from(s.children).some(child => child.classList.contains('student'));
                        if (!hasStudent) return s;
                    }
                    
                    // 1b. 如果后面没有，再从头循环找同组内前面的空位（填补之前可能被跳过的空缺）
                    for (let i = 0; i < currentSeatIndexInGroup; i++) {
                        let s = currentGroup.seats[i];
                        let hasStudent = Array.from(s.children).some(child => child.classList.contains('student'));
                        if (!hasStudent) return s;
                    }
                    
                    // 1c. 如果全组只剩下当前这一个座位是空的（并且用户刚才按 Tab 时没填名字）
                    // 就死死锁在这个位置，强制要求把当前组彻底填满才准走
                    let currentHasStudent = Array.from(currentSeat.children).some(child => child.classList.contains('student'));
                    if (!currentHasStudent) {
                        return currentSeat;
                    }
                }
                
                // 2. 如果当前小组所有位置都真的填满了，再往后（全局）寻找下一个空位
                for (let i = currentIndex + 1; i < orderedSeats.length; i++) {
                    let seat = orderedSeats[i];
                    let hasStudent = Array.from(seat.children).some(child => child.classList.contains('student'));
                    if (!hasStudent) {
                        return seat;
                    }
                }
                
                // 3. 如果后面没有任何空位了，退而求其次返回全局的下一个座位
                if (currentIndex < orderedSeats.length - 1) {
                    return orderedSeats[currentIndex + 1];
                }
            }
        }
        return null;
    }

    function generateLayout(skipSafetyBackup = false) {
        if (!skipSafetyBackup && !backupCurrentSeatState('重新生成座位前')) return;
        let wasMirrored = isMirrored;
        isMirrored = false; 
        
        isBoxesRemoved = false;
        savedBoxesData = [];
        let toggleBtn = document.getElementById('btn-toggle-boxes');
        if (toggleBtn) {
            toggleBtn.innerHTML = '🔲 去除所有小组框';
            toggleBtn.style.backgroundColor = '';
        }
        
        let cols = parseInt(document.getElementById('set-cols').value);
        let rows = parseInt(document.getElementById('set-rows').value);
        let colsPerGroup = parseInt(document.getElementById('set-colsPerGroup').value);
        let doorPos = document.getElementById('set-door').value;

        resetAll(); 
        classroom.innerHTML = ''; 
        
        customBoxes.forEach(b => b.el.remove());
        customBoxes = [];

        let groupSizes = [];
        let remaining = cols;
        if (doorPos === 'left') {
            while (remaining > 0) {
                let s = Math.min(colsPerGroup, remaining);
                groupSizes.push(s);
                remaining -= s;
            }
        } else {
            while (remaining > 0) {
                let s = Math.min(colsPerGroup, remaining);
                groupSizes.unshift(s); 
                remaining -= s;
            }
        }

        let seatCounter = 0;
        let groupCount = groupSizes.length;
        let subgroupsPerGroup = Math.ceil(rows / 2); 

        let startColOffsets = [];
        let currCol = 0;
        for(let g=0; g<groupCount; g++) {
            startColOffsets.push(currCol);
            currCol += groupSizes[g];
        }

        for (let g = 0; g < groupCount; g++) {
            let width = groupSizes[g];
            let groupDiv = document.createElement('div');
            groupDiv.className = 'group';
            let colOffset = startColOffsets[g];

            for (let sub = 0; sub < subgroupsPerGroup; sub++) {
                let subGroupDiv = document.createElement('div');
                subGroupDiv.className = 'subgroup';
                subGroupDiv.style.gridTemplateColumns = `repeat(${width}, 1fr)`;

                let rowsInThisSub = (sub === subgroupsPerGroup - 1 && rows % 2 !== 0) ? 1 : 2;
                let seatsInThisSub = width * rowsInThisSub;

                for (let s = 0; s < seatsInThisSub; s++) {
                    let seatDiv = document.createElement('div');
                    seatDiv.className = 'seat';
                    seatDiv.id = 'seat-' + seatCounter++;
                    
                    seatDiv.dataset.row = sub * 2 + Math.floor(s / width);
                    seatDiv.dataset.col = colOffset + (s % width);

                    seatDiv.oncontextmenu = function(e) {
                        e.preventDefault();
                        if (!backupCurrentSeatState('隐藏座位前')) return;
                        if (this.children.length > 0) {
                            let stu = this.children[0];
                            let correctPool = stu.classList.contains('boy') ? poolBoys : poolGirls;
                            correctPool.appendChild(stu);
                            sortPool(correctPool);
                            updatePoolCounts();
                        }
                        this.classList.add('deleted');
                    };

                    seatDiv.ondblclick = function(e) {
                        if (this.classList.contains('deleted')) {
                            if (!backupCurrentSeatState('恢复座位前')) return;
                            this.classList.remove('deleted');
                        }
                    };

                    seatDiv.ondrop = drop;
                    seatDiv.ondragover = allowDrop;
                    subGroupDiv.appendChild(seatDiv);
                }
                groupDiv.appendChild(subGroupDiv);
            }
            classroom.appendChild(groupDiv);
        }

        let doorDiv = document.createElement('div');
        doorDiv.className = 'door ' + doorPos;
        doorDiv.innerText = '前门';
        classroom.appendChild(doorDiv);

        classroom.offsetHeight; 
        
        let allSubgroups = Array.from(document.querySelectorAll('.subgroup'));
        allSubgroups.forEach((sub, subIndexOverall) => {
            let parentGrp = sub.parentElement;
            let domGroups = Array.from(document.querySelectorAll('.group'));
            let g = domGroups.indexOf(parentGrp);
            let subIndex = Array.from(parentGrp.querySelectorAll('.subgroup')).indexOf(sub);

            let logicalG_val = (doorPos === 'left') ? g : (groupCount - 1 - g);
            let colorIndex = (logicalG_val * subgroupsPerGroup + subIndex) % subgroupColors.length;
            let color = subgroupColors[colorIndex];

            let seats = Array.from(sub.querySelectorAll('.seat'));
            if(seats.length > 0) {
                createCustomBox(seats, color); 
            }
        });

        if (wasMirrored) toggleMirror(true);
        updatePoolCounts();
    }

    function randomizeSeats() {
        if (studentsData.length === 0) { alert('名单为空，请先导入！'); return; }
        if (!backupCurrentSeatState('随机排座前')) return;
        
        let wasMirrored = isMirrored;
        if (wasMirrored) toggleMirror(true);

        resetAll(); 

        let allSeats = Array.from(document.querySelectorAll('.seat:not(.deleted)'));
        allSeats.sort((a, b) => {
            let rA = parseInt(a.dataset.row), rB = parseInt(b.dataset.row);
            if (rA !== rB) return rA - rB;
            return parseInt(a.dataset.col) - parseInt(b.dataset.col);
        });

        let boys = Array.from(poolBoys.querySelectorAll('.student'));
        let girls = Array.from(poolGirls.querySelectorAll('.student'));

        // 使用无偏洗牌，保证每位学生落在任意位置的概率一致。
        ClassTools.shuffleInPlace(boys);
        ClassTools.shuffleInPlace(girls);

        allSeats.forEach(seat => {
            let r = parseInt(seat.dataset.row);
            let c = parseInt(seat.dataset.col);
            let isEven = (r + c) % 2 === 0;

            let targetPool = isEven ? boys : girls;
            let backupPool = isEven ? girls : boys; 

            let stu = targetPool.pop();
            if (!stu) stu = backupPool.pop(); 

            if (stu) {
                seat.appendChild(stu);
            }
        });

        if (wasMirrored) toggleMirror(true);
        updatePoolCounts();
    }

    function rotateGroups() {
        if (!backupCurrentSeatState('小组轮换前')) return;
        let wasMirrored = isMirrored;
        if (wasMirrored) toggleMirror(true);

        let doorPos = document.getElementById('set-door').value;
        let domGroups = Array.from(document.querySelectorAll('.group'));
        
        if (doorPos === 'right') domGroups.reverse();

        let orderedSubgroups = [];
        domGroups.forEach((g, i) => {
            let subs = Array.from(g.querySelectorAll('.subgroup'));
            if (i % 2 === 1) subs.reverse(); 
            orderedSubgroups.push(...subs);
        });

        let allSeats = [];
        orderedSubgroups.forEach(sub => {
            allSeats.push(...Array.from(sub.querySelectorAll('.seat:not(.deleted)')));
        });

        if (allSeats.length === 0) {
            if (wasMirrored) toggleMirror(true);
            return;
        }

        let studentsInSeats = allSeats.map(s => s.children.length > 0 ? s.children[0] : null);

        let colsPerGroup = parseInt(document.getElementById('set-colsPerGroup').value);
        let rows = parseInt(document.getElementById('set-rows').value);
        let rowsInStandardSub = rows >= 2 ? 2 : 1;
        let shiftStep = colsPerGroup * rowsInStandardSub; 

        let length = studentsInSeats.length;
        shiftStep = shiftStep % length;
        let shiftedStudents = [
            ...studentsInSeats.slice(length - shiftStep),
            ...studentsInSeats.slice(0, length - shiftStep)
        ];

        allSeats.forEach(s => {
            if (s.children.length > 0) {
                let stu = s.children[0];
                let correctPool = stu.classList.contains('boy') ? poolBoys : poolGirls;
                correctPool.appendChild(stu);
            }
        });

        allSeats.forEach((s, i) => {
            let stu = shiftedStudents[i];
            if (stu !== null) {
                s.appendChild(stu);
            }
        });
        
        sortPool(poolBoys);
        sortPool(poolGirls);

        if (wasMirrored) toggleMirror(true);
        updatePoolCounts();
    }

    function dragStart(e) {
        draggedElement = e.target;
        if (e.target.classList.contains('student') && !backupCurrentSeatState('移动学生前')) {
            e.preventDefault(); draggedElement = null; return;
        }
        if (e.target.id === 'rect-tool' && !backupCurrentSeatState('添加小组框前')) {
            e.preventDefault(); draggedElement = null; return;
        }
        setTimeout(() => { if (e.target.classList.contains('student')) e.target.classList.add('dragging'); }, 0);
        e.dataTransfer.effectAllowed = 'move';
    }

    function dragEnd(e) {
        if (e.target.classList.contains('student')) e.target.classList.remove('dragging');
        draggedElement = null;
    }

    function allowDrop(e) {
        let targetSeat = e.target.closest('.seat');
        if (targetSeat && targetSeat.classList.contains('deleted')) return; 

        if (draggedElement && draggedElement.classList.contains('student')) {
            let targetPool = e.target.closest('.pool-col');
            if (targetPool) {
                let isBoy = draggedElement.classList.contains('boy');
                let isGirl = draggedElement.classList.contains('girl');
                if ((targetPool.id === 'pool-boys' && isGirl) || (targetPool.id === 'pool-girls' && isBoy)) return;
            }
        }
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }

    function drop(e) {
        e.preventDefault();
        if (!draggedElement) return;

        if (draggedElement.id === 'rect-tool') {
            let targetSeat = e.target.closest('.seat:not(.deleted)');
            if (targetSeat) {
                createCustomBox([targetSeat]); 
            }
            return; 
        }
        
        let target = e.target;
        while (target && !target.classList.contains('seat') && !target.classList.contains('pool-col') && !target.classList.contains('student')) {
            target = target.parentNode;
            if (target === document.body) return; 
        }
        if (!target) return;

        if (target.classList.contains('seat') && target.classList.contains('deleted')) return;

        if (target.classList.contains('student') && target !== draggedElement) {
            let targetParent = target.parentNode;
            let sourceParent = draggedElement.parentNode;
            targetParent.appendChild(draggedElement);
            sourceParent.appendChild(target);
        } else if (target.classList.contains('seat') || target.classList.contains('pool-col')) {
            if (target.classList.contains('seat') && target.children.length > 0) {
                let existingStudent = target.children[0];
                let sourceParent = draggedElement.parentNode;
                target.appendChild(draggedElement);
                if (sourceParent.classList.contains('pool-col')) {
                    let exIsBoy = existingStudent.classList.contains('boy');
                    let correctPool = exIsBoy ? poolBoys : poolGirls;
                    correctPool.appendChild(existingStudent);
                    sortPool(correctPool);
                } else {
                    sourceParent.appendChild(existingStudent);
                }
            } else {
                target.appendChild(draggedElement);
                if (target.classList.contains('pool-col')) sortPool(target);
            }
        }
        updatePoolCounts();
    }

    function processDrop(target, draggedEl) {
        if (!draggedEl) return;
        if (draggedEl.id === 'rect-tool') {
            let targetSeat = target.closest('.seat:not(.deleted)');
            if (targetSeat) {
                createCustomBox([targetSeat]); 
            }
            return; 
        }
        while (target && !target.classList.contains('seat') && !target.classList.contains('pool-col') && !target.classList.contains('student')) {
            target = target.parentNode;
            if (target === document.body) return; 
        }
        if (!target) return;
        if (target.classList.contains('seat') && target.classList.contains('deleted')) return;

        if (target.classList.contains('pool-col') || target.closest('.pool-col')) {
            let pool = target.classList.contains('pool-col') ? target : target.closest('.pool-col');
            let isBoy = draggedEl.classList.contains('boy');
            let isGirl = draggedEl.classList.contains('girl');
            if ((pool.id === 'pool-boys' && isGirl) || (pool.id === 'pool-girls' && isBoy)) return;
        }

        if (target.classList.contains('student') && target !== draggedEl) {
            let targetParent = target.parentNode;
            let sourceParent = draggedEl.parentNode;
            targetParent.appendChild(draggedEl);
            sourceParent.appendChild(target);
        } else if (target.classList.contains('seat') || target.classList.contains('pool-col')) {
            if (target.classList.contains('seat') && target.children.length > 0) {
                let existingStudent = target.children[0];
                let sourceParent = draggedEl.parentNode;
                target.appendChild(draggedEl);
                if (sourceParent.classList.contains('pool-col')) {
                    let exIsBoy = existingStudent.classList.contains('boy');
                    let correctPool = exIsBoy ? poolBoys : poolGirls;
                    correctPool.appendChild(existingStudent);
                    sortPool(correctPool);
                } else {
                    sourceParent.appendChild(existingStudent);
                }
            } else {
                target.appendChild(draggedEl);
                if (target.classList.contains('pool-col')) sortPool(target);
            }
        }
        updatePoolCounts();
    }

    let touchDragTarget = null;
    let touchStartX = 0, touchStartY = 0;
    let ghostEl = null;
    let touchTimer = null;
    let isTouchDragging = false;

    document.addEventListener('touchstart', function(e) {
        let target = e.target.closest('.student') || e.target.closest('#rect-tool');
        if (target) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchDragTarget = target;
            draggedElement = target;

            touchTimer = setTimeout(() => {
                const backupReason = target.classList.contains('student') ? '移动学生前' : '添加小组框前';
                if (!backupCurrentSeatState(backupReason)) {
                    touchDragTarget = null;
                    draggedElement = null;
                    return;
                }
                isTouchDragging = true;
                target.style.opacity = '0.3'; 
                
                let rect = target.getBoundingClientRect();
                ghostEl = target.cloneNode(true);
                ghostEl.style.position = 'fixed';
                ghostEl.style.left = rect.left + 'px';
                ghostEl.style.top = rect.top + 'px';
                ghostEl.style.width = rect.width + 'px';
                ghostEl.style.height = rect.height + 'px';
                ghostEl.style.opacity = '0.9';
                ghostEl.style.zIndex = '99999';
                ghostEl.style.pointerEvents = 'none'; 
                ghostEl.style.boxShadow = '0 10px 20px rgba(0,0,0,0.4)';
                ghostEl.style.transform = 'scale(1.1)';
                document.body.appendChild(ghostEl);
                
                if (navigator.vibrate) navigator.vibrate(50);
            }, 150);
        }
    }, {passive: false});

    document.addEventListener('touchmove', function(e) {
        if (touchDragTarget) {
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            
            if (!isTouchDragging) {
                if (Math.abs(currentX - touchStartX) > 10 || Math.abs(currentY - touchStartY) > 10) {
                    clearTimeout(touchTimer);
                    touchDragTarget = null;
                    draggedElement = null;
                }
            } else {
                e.preventDefault(); 
                if (ghostEl) {
                    let dx = currentX - touchStartX;
                    let dy = currentY - touchStartY;
                    ghostEl.style.transform = `translate(${dx}px, ${dy}px) scale(1.1)`;
                }
            }
        }
    }, {passive: false});

    document.addEventListener('touchend', function(e) {
        clearTimeout(touchTimer);
        if (isTouchDragging && touchDragTarget) {
            touchDragTarget.style.opacity = '1'; 
            if (ghostEl) { ghostEl.remove(); ghostEl = null; }
            
            let touch = e.changedTouches[0];
            let dropTargetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            
            processDrop(dropTargetElement, touchDragTarget);
        }
        
        touchDragTarget = null;
        draggedElement = null;
        isTouchDragging = false;
    });

    function createCustomBox(seatsArray, specificColor = null) {
        let boxContainer = document.createElement('div');
        boxContainer.className = 'custom-box';
        
        let color = specificColor;
        if (!color) {
            color = boxColors[colorIndexTracker % boxColors.length];
            colorIndexTracker++;
        }
        boxContainer.style.borderColor = color;
        boxContainer.style.backgroundColor = 'transparent'; 

        let moveBtn = document.createElement('div');
        moveBtn.className = 'move-btn';
        moveBtn.innerText = '✥';
        moveBtn.onmousedown = function(e) { startMoveBox(e, boxObj); };
        moveBtn.ontouchstart = function(e) { startMoveBox(e, boxObj); };
        boxContainer.appendChild(moveBtn);

        let closeBtn = document.createElement('div');
        closeBtn.className = 'close-btn';
        closeBtn.innerText = '×';
        closeBtn.onclick = function() {
            if (!backupCurrentSeatState('删除小组框前')) return;
            boxContainer.remove();
            customBoxes = customBoxes.filter(b => b.el !== boxContainer);
        };
        boxContainer.appendChild(closeBtn);
        
        ['top', 'bottom', 'left', 'right'].forEach(pos => {
            let handle = document.createElement('div');
            handle.className = 'handle ' + pos;
            handle.style.borderColor = color;
            handle.onmousedown = function(e) { startResize(e, boxObj, pos); };
            handle.ontouchstart = function(e) { startResize(e, boxObj, pos); };
            boxContainer.appendChild(handle);
        });
        
        classroom.appendChild(boxContainer);
        
        let boxObj = {
            el: boxContainer, attachedSeats: seatsArray,
            updateLayout: function() {
                if (this.attachedSeats.length === 0) {
                    this.el.remove();
                    customBoxes = customBoxes.filter(b => b.el !== this.el);
                    return;
                }
                let classroomRect = classroom.getBoundingClientRect();
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                
                this.attachedSeats.forEach(seat => {
                    let rect = seat.getBoundingClientRect();
                    if (rect.left < minX) minX = rect.left;
                    if (rect.top < minY) minY = rect.top;
                    if (rect.right > maxX) maxX = rect.right;
                    if (rect.bottom > maxY) maxY = rect.bottom;
                });
                
                let padding = 8;
                this.el.style.left = (minX - classroomRect.left - padding) + 'px';
                this.el.style.top = (minY - classroomRect.top - padding) + 'px';
                this.el.style.width = (maxX - minX + padding * 2) + 'px';
                this.el.style.height = (maxY - minY + padding * 2) + 'px';
            }
        };
        customBoxes.push(boxObj);
        boxObj.updateLayout();
    }

    window.addEventListener('resize', () => customBoxes.forEach(b => b.updateLayout()));

    function startResize(e, box, pos) {
        e.preventDefault(); e.stopPropagation();
        if (!backupCurrentSeatState('调整小组框前')) return;
        activeBox = box; activeHandle = pos;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startRect = box.el.getBoundingClientRect();
        
        document.addEventListener('mousemove', onBoxMouseMove);
        document.addEventListener('mouseup', onBoxMouseUp);
        document.addEventListener('touchmove', onBoxMouseMove, { passive: false });
        document.addEventListener('touchend', onBoxMouseUp);
    }

    function onBoxMouseMove(e) {
        if (!activeBox) return;
        if (e.type === 'touchmove' && e.cancelable) e.preventDefault(); 
        
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let deltaX = clientX - startX, deltaY = clientY - startY;
        let classroomRect = classroom.getBoundingClientRect();
        let newTop = startRect.top, newBottom = startRect.bottom, newLeft = startRect.left, newRight = startRect.right;
        
        if (activeHandle === 'top') newTop += deltaY;
        if (activeHandle === 'bottom') newBottom += deltaY;
        if (activeHandle === 'left') newLeft += deltaX;
        if (activeHandle === 'right') newRight += deltaX;
        
        activeBox.el.style.top = (newTop - classroomRect.top) + 'px';
        activeBox.el.style.left = (newLeft - classroomRect.left) + 'px';
        activeBox.el.style.width = (newRight - newLeft) + 'px';
        activeBox.el.style.height = (newBottom - newTop) + 'px';
    }

    function startMoveBox(e, box) {
        e.preventDefault(); e.stopPropagation();
        if (!backupCurrentSeatState('移动小组框前')) return;
        moveActiveBox = box;
        moveStartX = e.touches ? e.touches[0].clientX : e.clientX;
        moveStartY = e.touches ? e.touches[0].clientY : e.clientY;
        moveStartRect = box.el.getBoundingClientRect();
        
        document.addEventListener('mousemove', onMoveBoxMove);
        document.addEventListener('mouseup', onMoveBoxUp);
        document.addEventListener('touchmove', onMoveBoxMove, { passive: false });
        document.addEventListener('touchend', onMoveBoxUp);
    }

    function onMoveBoxMove(e) {
        if (!moveActiveBox) return;
        if (e.type === 'touchmove' && e.cancelable) e.preventDefault();
        
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let deltaX = clientX - moveStartX;
        let deltaY = clientY - moveStartY;
        let classroomRect = classroom.getBoundingClientRect();

        moveActiveBox.el.style.top = (moveStartRect.top + deltaY - classroomRect.top) + 'px';
        moveActiveBox.el.style.left = (moveStartRect.left + deltaX - classroomRect.left) + 'px';
    }

    function onBoxMouseUp(e) {
        document.removeEventListener('mousemove', onBoxMouseMove);
        document.removeEventListener('mouseup', onBoxMouseUp);
        document.removeEventListener('touchmove', onBoxMouseMove);
        document.removeEventListener('touchend', onBoxMouseUp);
        if (activeBox) {
            recalculateBoxSeats(activeBox);
            activeBox = null; activeHandle = null;
        }
    }
    
    function onMoveBoxUp(e) {
        document.removeEventListener('mousemove', onMoveBoxMove);
        document.removeEventListener('mouseup', onMoveBoxUp);
        document.removeEventListener('touchmove', onMoveBoxMove);
        document.removeEventListener('touchend', onMoveBoxUp);
        if (moveActiveBox) {
            recalculateBoxSeats(moveActiveBox);
            moveActiveBox = null;
        }
    }

    function recalculateBoxSeats(boxTarget) {
        let visualRect = boxTarget.el.getBoundingClientRect();
        let allSeats = document.querySelectorAll('.seat');
        let newlyAttached = [];
        
        allSeats.forEach(seat => {
            let rect = seat.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2, centerY = rect.top + rect.height / 2;
            if (centerX >= visualRect.left && centerX <= visualRect.right && centerY >= visualRect.top && centerY <= visualRect.bottom) {
                newlyAttached.push(seat);
            }
        });
        
        if (newlyAttached.length > 0) {
            boxTarget.attachedSeats = newlyAttached;
        }
        boxTarget.updateLayout();
    }

    function saveRecord() {
        let slot = document.getElementById('save-slot').value;

        localStorage.setItem('seat_students_' + slot, JSON.stringify(ClassTools.normalizeStudentList(studentsData)));
        localStorage.setItem('seat_class_file_' + slot, currentClassListFile);

        let config = {
            cols: document.getElementById('set-cols').value,
            rows: document.getElementById('set-rows').value,
            colsPerGroup: document.getElementById('set-colsPerGroup').value,
            doorPos: document.getElementById('set-door').value,
            isMirrored: isMirrored
        };
        localStorage.setItem('seat_config_' + slot, JSON.stringify(config));

        let deletedSeatIds = Array.from(document.querySelectorAll('.seat.deleted')).map(s => s.id);
        localStorage.setItem('seat_history_deleted_' + slot, JSON.stringify(deletedSeatIds));

        let layout = {};
        document.querySelectorAll('.seat').forEach(seat => {
            if (seat.children.length > 0) layout[seat.id] = getStudentReference(seat.children[0]);
        });
        localStorage.setItem('seat_history_' + slot, JSON.stringify(layout));

        let boxesData = customBoxes.map(b => ({
            seats: b.attachedSeats.map(s => s.id),
            color: b.el.style.borderColor
        }));
        localStorage.setItem('seat_history_boxes_' + slot, JSON.stringify(boxesData));

        alert('✅ 保存成功：数据已保存至浏览器的【历史记录 ' + slot + '】中。');
    }

    function loadRecord(slot) {
        let layoutData = localStorage.getItem('seat_history_' + slot);
        if (!layoutData) { alert('❌ 本地历史记录 ' + slot + ' 为空，请先排列并保存！'); return; }

        let savedStudents = localStorage.getItem('seat_students_' + slot);
        let importedData = {
            studentsData: savedStudents ? JSON.parse(savedStudents) : null,
            classListFile: localStorage.getItem('seat_class_file_' + slot) || '',
            config: JSON.parse(localStorage.getItem('seat_config_' + slot) || 'null'),
            deletedSeatIds: JSON.parse(localStorage.getItem('seat_history_deleted_' + slot) || '[]'),
            layout: JSON.parse(layoutData),
            boxesData: JSON.parse(localStorage.getItem('seat_history_boxes_' + slot) || '[]')
        };
        
        if(!importedData.config) resetAll();
        
        applyImportedData(importedData);
    }

    function exportToFile() {
        if (studentsData.length === 0) { alert('当前没有学生数据，无法导出！'); return; }
        if (!currentClassListFile) { alert('请先选择班级。'); return; }

        let config = {
            cols: document.getElementById('set-cols').value,
            rows: document.getElementById('set-rows').value,
            colsPerGroup: document.getElementById('set-colsPerGroup').value,
            doorPos: document.getElementById('set-door').value,
            isMirrored: isMirrored
        };

        let deletedSeatIds = Array.from(document.querySelectorAll('.seat.deleted')).map(s => s.id);

        let layout = {};
        document.querySelectorAll('.seat').forEach(seat => {
            if (seat.children.length > 0) layout[seat.id] = getStudentReference(seat.children[0]);
        });

        let boxesData = customBoxes.map(b => ({
            seats: b.attachedSeats.map(s => s.id),
            color: b.el.style.borderColor
        }));

        let exportData = {
            schemaVersion: 3,
            updatedAt: Date.now(),
            classId: ClassTools.getClassNameFromRosterPath(currentClassListFile),
            rosterRevision: currentRosterRevision,
            config: config,
            deletedSeatIds: deletedSeatIds,
            layout: layout,
            boxesData: boxesData
        };

        let dataStr = JSON.stringify(exportData, null, 2);
        let blob = new Blob([dataStr], { type: "application/json" });
        let url = URL.createObjectURL(blob);

        let a = document.createElement('a');
        a.href = url;
        
        let now = new Date();
        let dateStr = now.getFullYear() + '-' + 
                      String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                      String(now.getDate()).padStart(2, '0') + '_' + 
                      String(now.getHours()).padStart(2, '0') + '-' + 
                      String(now.getMinutes()).padStart(2, '0') + '-' + 
                      String(now.getSeconds()).padStart(2, '0');
                      
        a.download = `班级座位记录_${dateStr}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    document.getElementById('file-import-record').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let importedData = JSON.parse(e.target.result);
                if (applyCloudSeatData(importedData) !== false) {
                    alert('✅ 成功读取本地排座文件并完美还原现场！');
                }
            } catch (err) {
                alert('读取文件失败，请确保导入的是通过本系统生成的 `.json` 排座记录文件！');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    generateLayout(true);

</script>
